<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Recipe Book</title>
  
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div class="container">
    <header>
      <div class="header-titles">
        <h1>Family Recipe Book</h1>
        <p class="subtitle">Our collection of favorite family recipes</p>
      </div>

      <button class="filter-toggle-btn" onclick="toggleSearchPanel()" title="Search & Filter">
        <span>🔍 Search & Filter</span>
      </button>
    </header>

    <!-- Collapsible Search & Import Panel -->
    <div class="search-panel" id="searchPanel">
      <div class="import-container">
        <input type="url" id="importUrlInput" class="import-input" placeholder="Paste web recipe URL (e.g. foodnetwork.com, allrecipes)...">
        <button class="import-btn" onclick="importRecipeFromUrl()">📥 Import</button>
      </div>

      <input type="text" id="searchInput" class="search-box" placeholder="Search recipes or ingredients..." onkeyup="filterRecipes()">
      
      <div class="filter-container" id="filterButtons">
        <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="setCategory('favorites', this)">★ Favorites</button>
        <button class="filter-btn" onclick="setCategory('imported', this)">📥 Imported</button>
        <button class="filter-btn" onclick="setCategory('breakfast', this)">Breakfast</button>
        <button class="filter-btn" onclick="setCategory('baking', this)">Baking</button>
        <button class="filter-btn" onclick="setCategory('snack', this)">Snack</button>
        <button class="filter-btn" onclick="setCategory('dinners', this)">Dinners</button>
      </div>
    </div>

    <!-- Dynamic Recipe Grid -->
    <div class="recipe-grid" id="recipeGrid">
      <p id="loadingMsg" style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Loading recipes...</p>
    </div>
  </div>

  <!-- Full Recipe View Modal -->
  <div class="modal-overlay" id="recipeModal" onclick="closeRecipeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-nav-bar">
        <button class="back-btn" onclick="closeRecipeModal(event)">&larr; Back to all recipes</button>
        <a id="standaloneLink" href="#" class="standalone-link" target="_blank">Open Full Page ↗</a>
      </div>
      
      <div id="modalBody"></div>

      <div class="action-bar">
        <button class="action-btn primary" onclick="window.print()">🖨️ Download as PDF / Print</button>
        <button class="action-btn" onclick="saveRecipeFile()">💾 Save to Device (.txt)</button>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = 'all';
    let currentRecipeTitle = 'Recipe';

    // Fallback list in case recipes.json network fetch delays
    const DEFAULT_RECIPES = [
      {
        id: "chocolate-chip-banana-muffins",
        path: "recipes/chocolate-chip-banana-muffins.html"
      },
      {
        id: "no-bake-peanut-butter-banana-granola-bites",
        path: "recipes/no-bake-peanut-butter-banana-granola-bites.html"
      },
      {
        id: "grandmas-lassies",
        path: "recipes/grandmas-lassies.html"
      }
    ];

    async function loadRecipesFromSubfolder() {
      const loadingMsg = document.getElementById('loadingMsg');
      let recipeList = DEFAULT_RECIPES;

      try {
        const res = await fetch('recipes.json');
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            recipeList = json;
          }
        }
      } catch (e) {
        console.warn('Could not load recipes.json, falling back to default list.', e);
      }

      if (loadingMsg) loadingMsg.remove();

      for (const item of recipeList) {
        try {
          const pageRes = await fetch(item.path);
          if (pageRes.ok) {
            const pageText = await pageRes.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(pageText, 'text/html');

            const title = doc.querySelector('h1')?.innerText || item.id.replace(/-/g, ' ');
            const metaBar = doc.querySelector('.recipe-meta-bar, .meta-info')?.innerText.replace(/\s+/g, ' ').trim() || 'Family Recipe';
            const metaKeywords = doc.querySelector('meta[name="keywords"]')?.getAttribute('content') || '';
            const tags = (title + ' ' + item.path + ' ' + metaKeywords).toLowerCase();

            createCardElement({
              id: item.id,
              title: title,
              meta: metaBar,
              tags: tags,
              path: item.path
            });
          } else {
            createCardElement({
              id: item.id,
              title: item.id.replace(/-/g, ' '),
              meta: 'Family Recipe',
              tags: item.id.replace(/-/g, ' '),
              path: item.path
            });
          }
        } catch (fileErr) {
          console.error(`Error loading ${item.path}:`, fileErr);
        }
      }

      loadImportedRecipes();
      updateStarIcons();
      filterRecipes();
    }

    function createCardElement(recipe) {
      if (document.getElementById('card-' + recipe.id)) return;

      const grid = document.getElementById('recipeGrid');
      const cardDiv = document.createElement('div');
      cardDiv.className = 'recipe-card';
      cardDiv.id = 'card-' + recipe.id;
      cardDiv.setAttribute('data-id', recipe.id);
      cardDiv.setAttribute('data-tags', recipe.tags || '');
      cardDiv.onclick = () => openRecipeModal(recipe.id, recipe.path);

      const displayTag = (recipe.tags || 'Recipe').split(' ')[0] || 'Family';

      cardDiv.innerHTML = `
        <div>
          <div class="card-top">
            <h2 class="recipe-title">${recipe.title}</h2>
            <button class="fav-btn" onclick="toggleFavorite(event, '${recipe.id}')" title="Toggle Favorite">☆</button>
          </div>
          <div class="recipe-meta">${recipe.meta}</div>
        </div>
        <div class="card-footer">
          <span class="tag-badge">📌 ${displayTag}</span>
          <span style="font-size: 0.82rem; color: var(--primary-color); font-weight: 600;">View Recipe →</span>
        </div>
      `;
      grid.appendChild(cardDiv);
    }

    async function openRecipeModal(recipeId, filePath) {
      const modalBody = document.getElementById('modalBody');
      const standaloneLink = document.getElementById('standaloneLink');

      if (filePath) {
        standaloneLink.href = filePath;
        standaloneLink.style.display = 'inline-block';
      } else {
        standaloneLink.style.display = 'none';
      }

      const imported = getImportedRecipes().find(r => r.id === recipeId);
      if (imported) {
        modalBody.innerHTML = imported.html;
        currentRecipeTitle = imported.title;
        standaloneLink.style.display = 'none';
        document.getElementById('recipeModal').classList.add('open');
        return;
      }

      if (filePath) {
        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error('File not found');
          
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');

          const container = doc.querySelector('.container') || doc.body;
          const backLink = container.querySelector('.back-link');
          if (backLink) backLink.remove();

          modalBody.innerHTML = container.innerHTML;
          const h1 = modalBody.querySelector('h1, h2');
          if (h1) currentRecipeTitle = h1.innerText;

          document.getElementById('recipeModal').classList.add('open');
        } catch (err) {
          modalBody.innerHTML = `<p style="color:#8B261D;">Unable to load recipe file at <code>${filePath}</code>.</p>`;
          document.getElementById('recipeModal').classList.add('open');
        }
      }
    }

    function closeRecipeModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('recipeModal').classList.remove('open');
    }

    function saveRecipeFile() {
      const content = document.getElementById('modalBody').innerText;
      const blob = new Blob([content], { type: 'text/plain' });
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = currentRecipeTitle.toLowerCase().replace(/\s+/g, '-') + '.txt';
      anchor.click();
    }

    function getImportedRecipes() {
      return JSON.parse(localStorage.getItem('importedRecipes') || '[]');
    }

    async function importRecipeFromUrl() {
      const urlInput = document.getElementById('importUrlInput');
      const url = urlInput.value.trim();

      if (!url) {
        alert('Please enter a valid recipe URL.');
        return;
      }

      try {
        const btn = document.querySelector('.import-btn');
        btn.innerText = 'Extracting...';

        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await response.json();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
        let recipeData = null;

        scripts.forEach(script => {
          try {
            const parsed = JSON.parse(script.textContent);
            const found = Array.isArray(parsed) ? parsed.find(item => item['@type'] === 'Recipe') : 
                          (parsed['@type'] === 'Recipe' ? parsed : (parsed['@graph'] ? parsed['@graph'].find(item => item['@type'] === 'Recipe') : null));
            if (found) recipeData = found;
          } catch(e){}
        });

        if (!recipeData) {
          alert('Could not find structured recipe data on that page.');
          btn.innerText = '📥 Import';
          return;
        }

        const id = 'imported-' + Date.now();
        const title = recipeData.name || 'Imported Recipe';
        const description = recipeData.description || 'Imported from ' + url;
        const ingredients = (recipeData.recipeIngredient || []).map(i => `<li>${i}</li>`).join('');
        
        let instructions = '';
        if (Array.isArray(recipeData.recipeInstructions)) {
          instructions = recipeData.recipeInstructions.map(step => `<li>${step.text || step}</li>`).join('');
        } else if (typeof recipeData.recipeInstructions === 'string') {
          instructions = `<li>${recipeData.recipeInstructions}</li>`;
        }

        const newRecipe = {
          id: id,
          title: title,
          tags: 'imported custom ' + title.toLowerCase(),
          html: `
            <h2>${title}</h2>
            <p style="color: #626C77; font-style: italic;">${description}</p>
            <h3>Ingredients</h3>
            <ul>${ingredients}</ul>
            <h3>Instructions</h3>
            <ol>${instructions}</ol>
            <p><a href="${url}" target="_blank" style="color: var(--primary-color);">Source Link</a></p>
          `
        };

        const imported = getImportedRecipes();
        imported.push(newRecipe);
        localStorage.setItem('importedRecipes', JSON.stringify(imported));

        urlInput.value = '';
        btn.innerText = '📥 Import';
        loadImportedRecipes();
        alert(`Successfully imported "${title}"!`);

      } catch (err) {
        console.error(err);
        alert('Failed to import recipe.');
        document.querySelector('.import-btn').innerText = '📥 Import';
      }
    }

    function loadImportedRecipes() {
      const imported = getImportedRecipes();
      imported.forEach(recipe => {
        createCardElement({
          id: recipe.id,
          title: recipe.title,
          meta: 'Imported Web Recipe',
          tags: recipe.tags,
          path: null
        });
      });
      updateStarIcons();
      filterRecipes();
    }

    function toggleSearchPanel() {
      document.getElementById('searchPanel').classList.toggle('open');
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem('favoriteRecipes') || '[]');
    }

    function toggleFavorite(event, recipeId) {
      event.preventDefault();
      event.stopPropagation();
      let favorites = getFavorites();
      if (favorites.includes(recipeId)) {
        favorites = favorites.filter(id => id !== recipeId);
      } else {
        favorites.push(recipeId);
      }
      localStorage.setItem('favoriteRecipes', JSON.stringify(favorites));
      updateStarIcons();
      filterRecipes();
    }

    function updateStarIcons() {
      const favorites = getFavorites();
      const cards = document.getElementsByClassName('recipe-card');
      for (let i = 0; i < cards.length; i++) {
        const recipeId = cards[i].getAttribute('data-id');
        const btn = cards[i].querySelector('.fav-btn');
        if (btn) {
          const isFav = favorites.includes(recipeId);
          btn.innerText = isFav ? '★' : '☆';
          if (isFav) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        }
      }
    }

    function setCategory(category, buttonElement) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
      filterRecipes();
    }

    function filterRecipes() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.getElementsByClassName('recipe-card');
      const favorites = getFavorites();

      for (let i = 0; i < cards.length; i++) {
        const recipeId = cards[i].getAttribute('data-id');
        const title = cards[i].querySelector('.recipe-title').innerText.toLowerCase();
        const tags = (cards[i].getAttribute('data-tags') || '').toLowerCase();
        
        const matchesSearch = title.includes(searchText) || tags.includes(searchText);
        let matchesCategory = (activeCategory === 'all') || 
                              (activeCategory === 'favorites' && favorites.includes(recipeId)) || 
                              tags.includes(activeCategory);

        cards[i].style.display = (matchesSearch && matchesCategory) ? "flex" : "none";
      }
    }

    document.addEventListener('DOMContentLoaded', loadRecipesFromSubfolder);
  </script>

</body>
</html>
